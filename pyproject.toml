[project]
name = "data-intelligence-assistant"
version = "1.1.0"
description = "An intelligent data science assistant that diagnoses datasets and trains baseline ML models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "S",   # bandit security
    "B",   # bugbear
    "UP",  # pyupgrade
    "BLE", # blind-except
    "PLC", # pylint convention
]
ignore = [
    "S101",   # assert in tests is fine
    "S105",   # hardcoded password - false positives on variable names
    "E501",   # line too long handled by formatter
    "N803",   # X/y-style argument names are the scikit-learn/numpy convention, not a typo
    "N806",   # same, for locals (X_train, X_proc, ...) — renaming would fight the ML ecosystem's
              # own naming convention for zero readability gain
    "BLE001", # this app deliberately catches broadly at the boundary of every optional/
              # third-party integration (sklearn, plotly, cloud SDKs, LLM providers, ...) and
              # then handles/logs/surfaces the error — narrowing each to a guessed specific
              # exception type risks silently missing one that should have been caught, for
              # a purely cosmetic win. Bare `except: pass`/`continue` (S110/S112) are NOT
              # exempted by this — those still get flagged, since silently swallowing with no
              # handling at all is a real bug, not a style choice.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE"]     # relax security rules in tests
"app.py" = ["E402"]          # st.set_page_config() must be Streamlit's first call, which
                             # forces some imports after it — required by Streamlit, not fixable
"api/server.py" = ["B008"]   # FastAPI's own idiomatic `= File(...)` / `= Depends(...)` pattern

[tool.ruff.lint.isort]
known-first-party = ["dia", "ui"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["xgboost.*", "lightgbm.*", "shap.*", "sentence_transformers.*",
          "boto3.*", "botocore.*", "google.*", "azure.*", "snowflake.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dia --cov-report=term-missing -v"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["dia"]
omit = ["tests/*", "dia/ingestion/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
