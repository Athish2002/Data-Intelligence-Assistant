[project]
name = "data-intelligence-assistant"
version = "1.1.0"
description = "An intelligent data science assistant that diagnoses datasets and trains baseline ML models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "S",   # bandit security
    "B",   # bugbear
    "UP",  # pyupgrade
    "BLE", # blind-except
    "PLC", # pylint convention
]
ignore = [
    "S101",  # assert in tests is fine
    "S105",  # hardcoded password - false positives on variable names
    "E501",  # line too long handled by formatter
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "BLE"]  # relax security rules in tests

[tool.ruff.isort]
known-first-party = ["dia", "ui"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["xgboost.*", "lightgbm.*", "shap.*", "sentence_transformers.*",
          "boto3.*", "botocore.*", "google.*", "azure.*", "snowflake.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dia --cov-report=term-missing -v"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["dia"]
omit = ["tests/*", "dia/ingestion/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
