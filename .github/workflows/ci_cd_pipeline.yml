name: Production CI/CD & Progressive Delivery Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Stage 1: Quality & Security Checks ─────────────────────────────────────
  lint-and-security:
    name: 🛡️ Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          pip install ruff bandit

      - name: Code Quality & Formatting Check (Ruff)
        run: |
          ruff check . --exit-zero

      - name: Static Application Security Testing (Bandit)
        run: |
          bandit -r dia/ -ll -ii --exit-zero

  # ─── Stage 2: Automated Tests & Validation ──────────────────────────────────
  test:
    name: 🧪 Unit & Integration Tests
    needs: lint-and-security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install xgboost lightgbm catboost pytest pytest-cov

      - name: Run E2E Test Suite
        run: |
          python test_e2e.py

  # ─── Stage 3: Container Build & Package ──────────────────────────────────────
  build-and-package:
    name: 📦 Container Build & Push
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Stage 4: Deploy to Staging ─────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: build-and-package
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.dia.internal

    steps:
      - name: Deploy to Staging Cluster
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} to Staging..."
          # kubectl apply -f k8s/staging/

      - name: Run Staging Health & Smoke Checks
        run: |
          echo "Verifying Staging endpoint health..."
          # curl -f --retry 5 --retry-delay 5 https://staging.dia.internal/health

  # ─── Stage 5: Production Deployment with Progressive Rollout ─────────────────
  deploy-production:
    name: 🌐 Progressive Production Delivery
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dia.internal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Rolling Update / Canary to Production
        run: |
          echo "Initiating progressive rolling deployment to Production..."
          # kubectl apply -f k8s/deployment.yaml
          # kubectl rollout status deployment/dia-assistant --timeout=180s

      - name: Automated Rollback Guard
        if: failure()
        run: |
          echo "⚠️ Deployment failure detected. Initiating immediate automated rollback..."
          # kubectl rollout undo deployment/dia-assistant

      - name: Post-Deployment Verification
        run: |
          echo "✅ Production deployment verified successfully."
