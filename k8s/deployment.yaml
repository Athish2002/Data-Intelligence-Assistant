apiVersion: apps/v1
kind: Deployment
metadata:
  name: dia-intelligence-service
  namespace: dia-system
  labels:
    app.kubernetes.io/name: data-intelligence-assistant
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: data-intelligence-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-intelligence-assistant
        tier: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: dia-server
          image: ghcr.io/your-org/data-intelligence-assistant:13.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dia-config
            - secretRef:
                name: dia-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: storage-volume
              mountPath: /data/dia
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: dia-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dia-intelligence-service
  namespace: dia-system
  labels:
    app.kubernetes.io/name: data-intelligence-assistant
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: data-intelligence-assistant
